<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <title>Portfolio</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
        }

    </style>
</head>

<body>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/EXRLoader.js"></script>

    <script>
        // 1. ตั้งค่า Renderer และระบบ Shadow Map
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        const scene = new THREE.Scene();

        const camera = new THREE.PerspectiveCamera(
            75,
            window.innerWidth / window.innerHeight,
            0.1,
            1000
        );
        camera.position.set(5, 8, 15);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xf8edd8, 0.4);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 1.2);
        directionalLight.position.set(10, 15, 10);
        directionalLight.castShadow = true;
        directionalLight.shadow.mapSize.width = 2048;
        directionalLight.shadow.mapSize.height = 2048;

        directionalLight.shadow.camera.near = 0.5;
        directionalLight.shadow.camera.far = 50;
        directionalLight.shadow.camera.left = -10;
        directionalLight.shadow.camera.right = 10;
        directionalLight.shadow.camera.top = 10;
        directionalLight.shadow.camera.bottom = -10;
        directionalLight.shadow.bias = -0.0005;

        scene.add(directionalLight);

        const exrSkyboxUrl = 'https://dl.polyhaven.org/file/ph-assets/HDRIs/exr/1k/venice_sunset_1k.exr';
        const pmremGenerator = new THREE.PMREMGenerator(renderer);
        pmremGenerator.compileEquirectangularShader();

        new THREE.EXRLoader()
            .setDataType(THREE.UnsignedByteType)
            .load(exrSkyboxUrl, (texture) => {
                const skybox = pmremGenerator.fromEquirectangular(texture).texture;
                scene.background = skybox;
                scene.environment = skybox;

                texture.dispose();
                pmremGenerator.dispose();
            }, undefined, (error) => {
                console.error('Unable to load EXR skybox:', error);
            });


        const uLightDir = { value: directionalLight.position.clone().normalize() };
        const whiteTexture = new THREE.DataTexture(
            new Uint8Array([255, 255, 255, 255]), 1, 1, THREE.RGBAFormat
        );
        whiteTexture.needsUpdate = true;

        const vertexShader = `
            varying vec2 vUv;
            varying vec3 vNormal;

            void main() {
                vUv = uv;
                vNormal = normalize(mat3(modelMatrix) * normal); // world space normal
                gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
            }
        `;

        const fragmentShader = `
            precision mediump float;

            uniform sampler2D uTexture;
            uniform vec3 uLightDir;
            uniform vec3 uBaseColor;
            varying vec2 vUv;
            varying vec3 vNormal;

            void main() {
                vec3 N = normalize(vNormal);
                vec3 L = normalize(uLightDir);

                float diffuse = max(dot(N, L), 0.0);
                float levels = 3.0;
                diffuse = floor(diffuse * levels) / levels;
                diffuse += 0.5;

                vec3 base = texture2D(uTexture, vUv).rgb * uBaseColor;
                vec3 finalColor = base * diffuse;

                gl_FragColor = vec4(finalColor, 1.0);
            }
        `;

        function makeCelMaterial(originalMaterial) {
            const map = originalMaterial && originalMaterial.map ? originalMaterial.map : whiteTexture;
            const baseColor = originalMaterial && originalMaterial.color
                ? originalMaterial.color
                : new THREE.Color(0xffffff);

            return new THREE.ShaderMaterial({
                vertexShader: vertexShader,
                fragmentShader: fragmentShader,
                uniforms: {
                    uLightDir: uLightDir,
                    uTexture: { value: map },
                    uBaseColor: { value: baseColor }
                },
                side: THREE.DoubleSide
            });
        }

        // ชื่อสำหรับกดวัตถุหนึ่งไปหาอีกวัตถุ
        const TARGETS = {
            'AboutMe': 'aboutB',
            'Skills': 'skillsB'
        };

        const TARGET_MAP = {};
        Object.keys(TARGETS).forEach((k) => {
            TARGET_MAP[k.toLowerCase()] = TARGETS[k].toLowerCase();
        });

        let modelRoot = null;

        function findNodeByName(name) {
            let found = null;
            if (!modelRoot) return null;
            modelRoot.traverse((n) => {
                if (!found && (n.name || '').toLowerCase() === name) found = n;
            });
            return found;
        }


        const FRONT_SIGN = 1;
        const FRAME_PADDING = 1.3;
        const FLY_DURATION = 1.2; 

        const pickables = [];   

        const homePos = camera.position.clone();
        const homeTarget = controls.target.clone();

        const raycaster = new THREE.Raycaster();
        const pointer = new THREE.Vector2();

        function findTargetNode(obj) {
            while (obj) {
                if (TARGET_MAP[(obj.name || '').toLowerCase()]) return obj;
                obj = obj.parent;
            }
            return null;
        }

        let fly = null;
        function flyTo(toPos, toTarget, label) {
            fly = {
                start: performance.now(),
                fromPos: camera.position.clone(),
                toPos: toPos,
                fromTarget: controls.target.clone(),
                toTarget: toTarget
            };
        }

        // เคลื่อนไปหาอีกวัตถุ
        function focusOn(node) {
            const destName = TARGET_MAP[node.name.toLowerCase()];
            const dest = findNodeByName(destName);
            if (!dest) {
                console.warn('Destination node not found:', destName);
                return;
            }

            const box = new THREE.Box3().setFromObject(dest);
            let center, dist;
            if (box.isEmpty()) {
                center = dest.getWorldPosition(new THREE.Vector3());
                dist = 5;
            } else {
                center = box.getCenter(new THREE.Vector3());
                const radius = box.getSize(new THREE.Vector3()).length() * 0.5;
                dist = (radius / Math.tan(THREE.MathUtils.degToRad(camera.fov * 0.5))) * FRAME_PADDING;
            }

            const front = new THREE.Vector3();
            dest.getWorldDirection(front);
            front.multiplyScalar(FRONT_SIGN).normalize();

            const toPos = center.clone().addScaledVector(front, dist);
            flyTo(toPos, center, destName);
        }

        let downX = 0, downY = 0;
        renderer.domElement.addEventListener('pointerdown', (e) => {
            downX = e.clientX;
            downY = e.clientY;
        });
        renderer.domElement.addEventListener('pointerup', (e) => {
            if (Math.hypot(e.clientX - downX, e.clientY - downY) > 5) return; 
            onPick(e);
        });

        function onPick(e) {
            const r = renderer.domElement.getBoundingClientRect();
            pointer.x = ((e.clientX - r.left) / r.width) * 2 - 1;
            pointer.y = -((e.clientY - r.top) / r.height) * 2 + 1;

            raycaster.setFromCamera(pointer, camera);
            const hit = raycaster.intersectObjects(pickables, false)[0];
            const node = hit ? findTargetNode(hit.object) : null;

            if (node) {
                console.log('Picked:', node.name);
                focusOn(node);
            } else {
                flyTo(homePos.clone(), homeTarget.clone(), null);
            }
        }

        function updateFly() {
            if (!fly) return;
            let t = (performance.now() - fly.start) / (FLY_DURATION * 1000);
            if (t >= 1) t = 1;
            const k = t * t * (3 - 2 * t); 

            camera.position.lerpVectors(fly.fromPos, fly.toPos, k);
            controls.target.lerpVectors(fly.fromTarget, fly.toTarget, k);

            if (t === 1) fly = null;
        }

        controls.addEventListener('start', () => { fly = null; });

        const loader = new THREE.GLTFLoader();
        loader.load('https://raw.githubusercontent.com/SPRk02/SPRk02.github.io/main/coffee.glb', (gltf) => {
            const model = gltf.scene;
            modelRoot = model;
            model.traverse((child) => {
                if (child.isMesh) {
                    child.castShadow = true;
                    child.receiveShadow = true;

                    child.material = makeCelMaterial(child.material);

                    child.customDepthMaterial = new THREE.MeshDepthMaterial({
                        depthPacking: THREE.RGBADepthPacking,
                        map: child.material.uniforms.uTexture.value,
                        alphaTest: 0.5
                    });

                    pickables.push(child);
                }
            });
            model.position.set(0, 0, 1);
            model.scale.set(3, 3, 3);
            scene.add(model);

            model.traverse((n) => {
                const nm = (n.name || '').toLowerCase();
                if (TARGET_MAP[nm]) console.log('Found clickable node:', n.name);
                if (Object.values(TARGET_MAP).includes(nm)) console.log('Found destination node:', n.name);
            });
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        });

        function animate() {
            updateFly();
            controls.update();

            uLightDir.value.copy(directionalLight.position).normalize();

            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        }
        animate();
    </script>
</body>

</html>
